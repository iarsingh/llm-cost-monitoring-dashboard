apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-cost-monitoring-dashboard
  labels:
    app: llm-cost-monitoring-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-cost-monitoring-dashboard
  template:
    metadata:
      labels:
        app: llm-cost-monitoring-dashboard
    spec:
      containers:
        - name: api
          image: llm-cost-monitoring-dashboard:local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: llm-cost-monitoring-dashboard
spec:
  selector:
    app: llm-cost-monitoring-dashboard
  ports:
    - port: 80
      targetPort: 8080
